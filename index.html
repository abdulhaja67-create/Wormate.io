<!DOCTYPE html>
<html>
<head>
    <title>Snake Game 🐍</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            background: #111;
        }

        .screen {
            display: none;
        }

        .active {
            display: block;
        }

        /* =========================
           START SCREEN - GERMANY 🇩🇪
        ========================= */

        #startScreen {
            min-height: 100vh;
            padding-top: 80px;

            background:
                linear-gradient(
                    rgba(0,0,0,0.35),
                    rgba(0,0,0,0.35)
                ),
                linear-gradient(
                    #000000 0%,
                    #000000 33.3%,
                    #dd0000 33.3%,
                    #dd0000 66.6%,
                    #ffce00 66.6%,
                    #ffce00 100%
                );
        }

        #startBox {
            background: rgba(0,0,0,0.75);
            display: inline-block;
            padding: 30px;
            border-radius: 20px;
        }

        #startBox h1 {
            font-size: 40px;
        }

        input {
            padding: 13px;
            margin: 8px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            width: 240px;
        }

        button {
            padding: 13px 25px;
            margin: 8px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* =========================
           GAME
        ========================= */

        #gameScreen {
            min-height: 100vh;
            padding-top: 10px;
        }

        #gameCanvas {
            background: #31552b;
            border: 5px solid white;

            width: min(94vw, 800px);
            height: min(70vh, 600px);

            touch-action: none;
        }

        #info {
            font-size: 20px;
            margin: 10px;
        }

        .controls button {
            width: 65px;
            height: 55px;
            padding: 0;
        }

        /* =========================
           GAME OVER
        ========================= */

        #gameOverScreen {
            min-height: 100vh;
            padding-top: 140px;

            background:
                radial-gradient(
                    circle,
                    #8b0000,
                    #150000
                );
        }

        #gameOverScreen h1 {
            font-size: 60px;
        }

        #finalScore {
            font-size: 25px;
        }
    </style>
</head>

<body>


<!-- =========================
     START
========================= -->

<div id="startScreen" class="screen active">

    <div id="startBox">

        <h1>🇩🇪 🐍 SNAKE GAME 🐍 🇩🇪</h1>

        <p>Welcome to the game!</p>

        <input
            id="playerName"
            type="text"
            placeholder="Your name"
        >

        <br>

        <input
            id="playerAge"
            type="number"
            placeholder="Your age"
        >

        <br>

        <button onclick="startGame()">
            🎮 START GAME
        </button>

        <button onclick="startGame()">
            🔎 FIND NEW GAME
        </button>

    </div>

</div>


<!-- =========================
     GAME
========================= -->

<div id="gameScreen" class="screen">

    <h1>🐍 Snake</h1>

    <div id="info">

        Player:
        <span id="showName"></span>

        |

        Age:
        <span id="showAge"></span>

        |

        🍎 Score:
        <span id="score">0</span>

    </div>

    <canvas
        id="gameCanvas"
        width="800"
        height="600">
    </canvas>

    <div class="controls">

        <div>
            <button onclick="changeDirection('up')">
                ⬆️
            </button>
        </div>

        <div>
            <button onclick="changeDirection('left')">
                ⬅️
            </button>

            <button onclick="changeDirection('down')">
                ⬇️
            </button>

            <button onclick="changeDirection('right')">
                ➡️
            </button>
        </div>

    </div>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="gameOverScreen" class="screen">

    <h1>💀 GAME OVER 💀</h1>

    <p id="finalScore"></p>

    <button onclick="restartGame()">
        🔄 RESTART
    </button>

    <button onclick="goHome()">
        🏠 HOME
    </button>

</div>


<script>

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


let snake = [];

let apple = {};

let watermelon = {};

let direction = "right";

let nextDirection = "right";

let score = 0;

let gameLoop;

let gameRunning = false;

let playerName = "";

let playerAge = "";


/* =========================
   SOUND
========================= */

function playSound(frequency, duration) {

    const audio =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.frequency.value =
        frequency;

    oscillator.type = "sine";

    gain.gain.setValueAtTime(
        0.25,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.01,
        audio.currentTime + duration
    );

    oscillator.start();

    oscillator.stop(
        audio.currentTime + duration
    );
}


/* =========================
   START
========================= */

function startGame() {

    playerName =
        document.getElementById(
            "playerName"
        ).value.trim();

    playerAge =
        document.getElementById(
            "playerAge"
        ).value.trim();


    if (
        playerName === "" ||
        playerAge === ""
    ) {

        alert(
            "Please enter your name and age!"
        );

        return;
    }


    document.getElementById(
        "showName"
    ).innerText = playerName;

    document.getElementById(
        "showAge"
    ).innerText = playerAge;


    document.getElementById(
        "startScreen"
    ).classList.remove("active");


    document.getElementById(
        "gameScreen"
    ).classList.add("active");


    restartGame();
}


/* =========================
   RESTART
========================= */

function restartGame() {

    clearInterval(gameLoop);


    snake = [

        {x:400, y:300},
        {x:380, y:300},
        {x:360, y:300},
        {x:340, y:300}

    ];


    direction = "right";

    nextDirection = "right";

    score = 0;


    document.getElementById(
        "score"
    ).innerText = score;


    document.getElementById(
        "gameOverScreen"
    ).classList.remove("active");


    document.getElementById(
        "gameScreen"
    ).classList.add("active");


    createApple();

    createWatermelon();


    gameRunning = true;

    draw();


    gameLoop =
        setInterval(
            update,
            100
        );
}


/* =========================
   CREATE APPLE 🍎
========================= */

function createApple() {

    let newApple;

    do {

        newApple = {

            x:
                Math.floor(
                    Math.random() * 39
                ) * 20 + 20,

            y:
                Math.floor(
                    Math.random() * 29
                ) * 20 + 20
        };

    } while (
        snake.some(
            part =>
                part.x === newApple.x &&
                part.y === newApple.y
        )
    );


    apple = newApple;
}


/* =========================
   CREATE WATERMELON 🍉
========================= */

function createWatermelon() {

    let newWatermelon;

    do {

        newWatermelon = {

            x:
                Math.floor(
                    Math.random() * 39
                ) * 20 + 20,

            y:
                Math.floor(
                    Math.random() * 29
                ) * 20 + 20
        };

    } while (

        snake.some(
            part =>
                part.x === newWatermelon.x &&
                part.y === newWatermelon.y
        )

        ||

        (
            newWatermelon.x === apple.x &&
            newWatermelon.y === apple.y
        )
    );


    watermelon = newWatermelon;
}


/* =========================
   GAME UPDATE
========================= */

function update() {

    if (!gameRunning)
        return;


    direction = nextDirection;


    let head = {

        x: snake[0].x,
        y: snake[0].y

    };


    if (direction === "up")
        head.y -= 20;

    if (direction === "down")
        head.y += 20;

    if (direction === "left")
        head.x -= 20;

    if (direction === "right")
        head.x += 20;


    /* WALL */

    if (
        head.x < 20 ||
        head.x > 780 ||
        head.y < 20 ||
        head.y > 580
    ) {

        endGame();

        return;
    }


    /* HIT YOURSELF */

    for (let part of snake) {

        if (
            head.x === part.x &&
            head.y === part.y
        ) {

            endGame();

            return;
        }
    }


    snake.unshift(head);


    /* =========================
       EAT APPLE 🍎
       + ONE BODY PART
    ========================= */

    if (
        head.x === apple.x &&
        head.y === apple.y
    ) {

        score++;

        document.getElementById(
            "score"
        ).innerText = score;


        // صوت التفاحة

        playSound(700, 0.15);


        // تفاحة جديدة

        createApple();


        // لا نحذف الذيل
        // لذلك الحية تكبر وحدة


    }

    /* =========================
       EAT WATERMELON 🍉
       + TWO BODY PARTS
    ========================= */

    else if (
        head.x === watermelon.x &&
        head.y === watermelon.y
    ) {

        score += 2;

        document.getElementById(
            "score"
        ).innerText = score;


        // صوت البطيخ

        playSound(400, 0.3);


        // بطيخ جديد

        createWatermelon();


        /*
          لا نحذف الذيل الآن،
          ونضيف جزء إضافي
          حتى تكبر مرتين.
        */

        snake.push({
            x: snake[snake.length - 1].x,
            y: snake[snake.length - 1].y
        });

    }

    else {

        // لا أكل
        snake.pop();
    }


    draw();
}


/* =========================
   DRAW
========================= */

function draw() {

    /* BACKGROUND */

    ctx.fillStyle = "#31552b";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* =========================
       APPLE 🍎
    ========================= */

    ctx.fillStyle = "rgba(0,0,0,0.3)";

    ctx.beginPath();

    ctx.ellipse(
        apple.x,
        apple.y + 13,
        16,
        6,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "#e31b23";

    ctx.beginPath();

    ctx.arc(
        apple.x - 7,
        apple.y,
        13,
        0,
        Math.PI * 2
    );

    ctx.arc(
        apple.x + 7,
        apple.y,
        13,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Apple shine */

    ctx.fillStyle = "#ffaaaa";

    ctx.beginPath();

    ctx.arc(
        apple.x - 7,
        apple.y - 6,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Apple stem */

    ctx.strokeStyle = "#542d16";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(
        apple.x,
        apple.y - 10
    );

    ctx.lineTo(
        apple.x + 5,
        apple.y - 22
    );

    ctx.stroke();


    /* =========================
       WATERMELON 🍉
    ========================= */

    ctx.fillStyle = "#087f23";

    ctx.beginPath();

    ctx.arc(
        watermelon.x,
        watermelon.y,
        17,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Watermelon stripes */

    ctx.strokeStyle = "#55c957";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.arc(
        watermelon.x,
        watermelon.y,
        12,
        -1,
        1
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        watermelon.x,
        watermelon.y,
        7,
        -1,
        1
    );

    ctx.stroke();


    /* =========================
       SNAKE 🐍
    ========================= */

    for (
        let i = snake.length - 1;
        i >= 0;
        i--
    ) {

        let part = snake[i];


        if (i === 0) {

            /* HEAD */

            ctx.fillStyle = "#43d65c";

            ctx.beginPath();

            ctx.arc(
                part.x,
                part.y,
                18,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* Eyes */

            ctx.fillStyle = "white";

            ctx.beginPath();

            ctx.arc(
                part.x - 7,
                part.y - 7,
                5,
                0,
                Math.PI * 2
            );

            ctx.arc(
                part.x + 7,
                part.y - 7,
                5,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle = "black";

            ctx.beginPath();

            ctx.arc(
                part.x - 7,
                part.y - 7,
                2,
                0,
                Math.PI * 2
            );

            ctx.arc(
                part.x + 7,
                part.y - 7,
                2,
                0,
                Math.PI * 2
            );

            ctx.fill();


        } else {

            /* BODY */

            ctx.fillStyle =
                i % 2 === 0
                ? "#2fa84b"
                : "#45c95b";


            ctx.beginPath();

            ctx.arc(
                part.x,
                part.y,
                16,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.strokeStyle = "#176b2c";

            ctx.lineWidth = 2;

            ctx.stroke();
        }
    }
}


/* =========================
   CONTROLS
========================= */

function changeDirection(newDirection) {

    if (
        newDirection === "up" &&
        direction !== "down"
    )
        nextDirection = "up";


    if (
        newDirection === "down" &&
        direction !== "up"
    )
        nextDirection = "down";


    if (
        newDirection === "left" &&
        direction !== "right"
    )
        nextDirection = "left";


    if (
        newDirection === "right" &&
        direction !== "left"
    )
        nextDirection = "right";
}


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowUp")
            changeDirection("up");

        if (event.key === "ArrowDown")
            changeDirection("down");

        if (event.key === "ArrowLeft")
            changeDirection("left");

        if (event.key === "ArrowRight")
            changeDirection("right");

    }
);


/* =========================
   GAME OVER
========================= */

function endGame() {

    gameRunning = false;

    clearInterval(gameLoop);


    // صوت الموت

    playSound(120, 0.7);


    document.getElementById(
        "finalScore"
    ).innerText =
        playerName +
        ", your score was: " +
        score;


    document.getElementById(
        "gameScreen"
    ).classList.remove("active");


    document.getElementById(
        "gameOverScreen"
    ).classList.add("active");
}


/* =========================
   HOME
========================= */

function goHome() {

    clearInterval(gameLoop);

    gameRunning = false;


    document.getElementById(
        "gameOverScreen"
    ).classList.remove("active");


    document.getElementById(
        "gameScreen"
    ).classList.remove("active");


    document.getElementById(
        "startScreen"
    ).classList.add("active");
}

</script>

</body>
</html>
